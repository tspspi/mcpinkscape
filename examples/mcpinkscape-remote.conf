{
  "mode": "remotehttp",
  "logging": {
    "level": "INFO"
  },
  "bridge": {
    "mode": "auto",
    "uds": "~/.local/state/mcpinkscape/bridge.sock",
    "tcp_host": "127.0.0.1",
    "tcp_port": 61779,
    "timeout_seconds": 30.0,
    "required": false
  },
  "stdio": {
    "document_root": "./mcpinkscape-library",
    "allow_document_write": true,
    "allow_snapshots": true,
    "allow_live_control": true,
    "enable_autonomous_execution": true
  },
  "remote_server": {
    "transport": {
      "host": "127.0.0.1",
      "port": 61780
    },
    "api_key_kdf": {
      "algorithm": "argon2id",
      "time_cost": 3,
      "memory_cost": 65536,
      "parallelism": 1,
      "hash_len": 32
    }
  },
  "api_keys": [
    {
      "id": "drawing-agent",
      "document_root": "./mcpinkscape-library",
      "allow_document_write": true,
      "allow_snapshots": true,
      "allow_live_control": true,
      "enable_autonomous_execution": true
    }
  ]
}
